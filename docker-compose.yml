services:
  github-mcp:
    image: lqdflying/githubmcp:v2.4.2
    container_name: github-mcp
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - FASTMCP_HOME=/data/fastmcp
    volumes:
      - mcp-oauth-data:/data/fastmcp
    restart: unless-stopped

volumes:
  mcp-oauth-data:
